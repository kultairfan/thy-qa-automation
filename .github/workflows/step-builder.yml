name: Step Builder

# Started by n8n when the Gherkin writer needs steps that do not exist yet.
# Explores the site, writes page object + step code with Gemini, validates it here
# (bddgen, tsc, real scenario run) and opens a pull request for human review.
on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira story key, e.g. THY-33'
        required: true
      missing_steps:
        description: 'Missing steps, one per line'
        required: false
        default: ''
      story:
        description: 'Story summary and acceptance criteria'
        required: false
        default: ''
      draft_feature:
        description: 'Draft feature file written by the Gherkin writer'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: step-builder-${{ inputs.issue_key }}
  cancel-in-progress: false

jobs:
  build-steps:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build missing steps
        env:
          ISSUE_KEY: ${{ inputs.issue_key }}
          MISSING_STEPS: ${{ inputs.missing_steps }}
          STORY: ${{ inputs.story }}
          DRAFT_FEATURE: ${{ inputs.draft_feature }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          # Fallback providers: used only when their secret exists (order: LLM_ORDER)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'openai/gpt-oss-120b' }}
          LLM_ORDER: ${{ vars.LLM_ORDER || 'gemini,groq,nvidia' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: node scripts/step-builder.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-builder-${{ inputs.issue_key }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            features/
            pages/
            steps/
          retention-days: 14
