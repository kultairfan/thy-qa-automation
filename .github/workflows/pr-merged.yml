name: PR Merged

# When a pull request is merged into main, tell n8n (Flow 5). n8n decides what to run:
# only the story of the PR (default) or every test (PR label "run-all-tests").
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  notify-n8n:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send the merged pull request to n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          HOOK="${N8N_WEBHOOK_URL%/}"
          HOOK="${HOOK%/qa-test-results}/qa-pr-merged"
          jq -n \
            --arg number "$PR_NUMBER" --arg title "$PR_TITLE" --arg branch "$PR_BRANCH" \
            --arg url "$PR_URL" --arg labels "$PR_LABELS" --arg mergedBy "$MERGED_BY" \
            '{number: ($number | tonumber), title: $title, branch: $branch, url: $url,
              labels: ($labels | split(",") | map(select(. != ""))), mergedBy: $mergedBy}' \
          | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$HOOK"
          echo "Sent PR #$PR_NUMBER ($PR_BRANCH) to n8n"
