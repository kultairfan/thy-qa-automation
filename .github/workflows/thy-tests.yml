name: BDD Tests

on:
  # Started by n8n (GitHub API) or manually from the Actions tab
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira story key to run, e.g. THY-23 (empty = run all)'
        required: false
        default: ''
  # A merged pull request no longer starts this workflow by itself: GitHub tells n8n (PR Merged workflow),
  # and n8n starts the tests of that story only, or every test when the PR has the label "run-all-tests".

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: thy-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Official Playwright image: browsers are preinstalled, so no slow install step
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    # The latest report is published to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 15
    env:
      REPORT_URL: https://kultairfan.github.io/thy-qa-automation/
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run BDD tests
        env:
          ISSUE_KEY: ${{ inputs.issue_key }}
        run: |
          npx bddgen
          if [ -n "$ISSUE_KEY" ]; then
            npx playwright test --grep "@$ISSUE_KEY"
          else
            npx playwright test
          fi

      - name: Prepare report (summary + last-step screenshots)
        if: always()
        env:
          ISSUE_KEY: ${{ inputs.issue_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-n8n.mjs prepare

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            playwright-report/
            cucumber-report/
            test-results/
          retention-days: 14

      - name: Upload report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Publish report
        id: deploy
        if: always()
        uses: actions/deploy-pages@v4

      - name: Send results to n8n
        if: always()
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: node scripts/notify-n8n.mjs send
